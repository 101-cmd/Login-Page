<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="sign-up-container">
        <form action="#">
            <h1>Register to Continue</h1>

            <div class="form-group">
                <input type="text" id="first-name" placeholder="Enter First Name" required>
            </div>

            <div class="form-group">
                <input type="text" id="last-name" placeholder="Enter Last Name" required>
            </div>

            <div class="form-group">
                <input type="text" id="last-name" placeholder="Enter Username" required>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Enter Email" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" minlength="5" maxlength="5" placeholder="Enter Password" required>
            </div>

            <div class="form-group">
                <input type="password" id="confirm-password" minlength="5" maxlength="5" placeholder="Confirm Password"
                    required>
            </div>

            <button class="btn" type="submit">Register</button>
            <div class="back-link">
                <p>Already have an Account? <a href="index.html">Login</a></p>
            </div>
        </form>
    </div>
</body>

</html>
