<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acount Recovery</title>
    <link rel="stylesheet" href="css/forgot.css">
</head>

<body>
    <div class="forgot-container">
        <form action="#">
            <h1> Acount Recovery</h1>
            <div class="form-group">
                <input type="email/text" id="email" placeholder="Enter Email or Username" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" minlength="5" maxlength="5" placeholder="Enter Current Password"
                    required>
            </div>

            <div class="form-group">
                <input type="password" id="password" minlength="5" maxlength="5" placeholder="Enter New Password"
                    required>
            </div>

            <div class="form-group">
                <input type="password" id="password" minlength="5" maxlength="5" placeholder="Confirm Password"
                    required>
            </div>

            <button class="btn" type="submit">Recover Account</button>
            <div class="back-link">
                <p><a href="index.html">Back to Login Page</a></p>
            </div>
        </form>
    </div>
</body>

</html>
